name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # raw-data tests skip automatically; website tests fail if a JSON file is missing,
      # a headline value is null, or index.html is out of sync with metrics.json
      - run: pytest -q tests
      - run: python src/site_render.py --check
